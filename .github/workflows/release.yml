name: Release
# Publishes this package to npm when a tag vX.Y.Z is pushed.
#
# The first publication of a new package is done by hand (npm publish, logged in as the owner).
# After that, configure a Trusted Publisher for this repository on npmjs.com: this workflow then
# publishes with a short-lived OIDC token and no stored secret. NPM_TOKEN is only a fallback.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag must match package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md." --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
